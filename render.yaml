services:
  - type: web
    name: ai-resume-screener-api
    runtime: python
    pythonVersion: "3.12"
    buildCommand: cd ai-resume-screener/backend && pip install --upgrade pip && pip install --prefer-binary -r requirements.txt
    startCommand: cd ai-resume-screener/backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:////tmp/ai_screener.db
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: https://your-vercel-app.vercel.app,http://localhost:5173
